[note-taking-app]
user = noteapp
group = noteapp

listen = /var/opt/remi/php85/run/php-fpm/note-taking-app.sock
listen.owner = nginx
listen.group = nginx
listen.mode = 0660

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests = 500

php_admin_flag[log_errors] = on
php_admin_value[error_log] = /var/log/php-fpm/note-taking-app-error.log
php_admin_value[session.save_path] = /var/opt/remi/php85/lib/php/session
php_value[opcache.enable] = 1

clear_env = yes
security.limit_extensions = .php
