server {
    listen 80;
    listen [::]:80;
    server_name note-api.51-75-162-34.sslip.io;

    root /var/www/note-taking-app/api/public;
    index index.php;
    server_tokens off;
    client_max_body_size 1m;

    access_log /var/log/nginx/note-taking-app.access.log;
    error_log /var/log/nginx/note-taking-app.error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass unix:/var/opt/remi/php85/run/php-fpm/note-taking-app.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
    }

    location ~ /\.(?!well-known/) {
        deny all;
    }
}
